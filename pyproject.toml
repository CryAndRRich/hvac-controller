[project]
name = "smart-buildings-competition"
version = "0.1.0"
description = "Smart Buildings Foundation Model Competition"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Judah Goldfeder" },
    { name = "Ayush Rai" },
]
# Versions pinned to those provided by gcr.io/kaggle-images/python:latest so
# the project runs with only image-supplied packages (no pint/bidict/mediapy).
dependencies = [
    "numpy==2.0.2",
    "numba==0.60.0",
    "pandas==2.3.3",
    "matplotlib==3.10.0",
    "gymnasium==1.2.0",
    "gin-config==0.5.0",
    "opencv-python==4.13.0.92",
    "protobuf==5.29.5",
    "pillow==11.3.0",
    "pytz==2025.2",
    "holidays==0.95",
    "plotly==5.24.1",
    "seaborn==0.13.2",
    "scipy==1.16.3",
    "scikit-learn==1.6.1",
    "pyyaml==6.0.3",
    "google-genai==1.68.0",
    "google-auth==2.47.0",
    "absl-py==1.4.0",
    "importlib_resources==7.1.0",
    "imageio==2.37.3",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
# Nothing in this repo needs torch. The extra is kept only as a convenience for
# participants who want to write a learned policy; no shipped baseline uses it.
#
# Unpinned deliberately: torch does not declare numpy as a hard dependency, so
# installing it leaves the numpy 2.0.2 / numba 0.60.0 pins above untouched.
# Verified: numpy stays 2.0.2, numba 0.60.0, njit and interop keep working.
# Cost is disk -- the venv grows roughly 200 MB to 800 MB -- so prefer the
# CPU-only wheel unless you are training on GPU.
learned = [
    "torch",
]
dev = [
    "pytest>=8.0.0",
    "absl-py",
    "pyink",
    "isort",
    "pylint",
    "mdformat",
    # Stub-only, for `ty check`. protobuf 5.29.x ships no .pyi files at all, so
    # `google.protobuf.timestamp_pb2` and friends look empty without these.
    # pandas ships inline .pyi but they are loose enough to be noisy; keep
    # pandas-stubs on the same minor as the pinned pandas.
    "types-protobuf",
    "pandas-stubs~=2.3.0",
]

# `uvx ty check smart_buildings` type-checks the project. It resolves imports
# from ./.venv, so run `uv sync --extra dev` first or the stub-only packages in
# the dev extra will be missing.
#
# The protobuf .pyi stubs were removed from this fork; regenerate them with
# mypy-protobuf if type checking is wanted.
#
# Remaining unresolved-import diagnostics are expected: torch is the `learned`
# extra, and mediapy / IPython are notebook-only and imported lazily.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Generated by protoc: never lint or reformat. The timestamp_pb2 import looks
# unused but is what registers google/protobuf/timestamp.proto in the default
# descriptor pool before AddSerializedFile runs, and these files are regenerated
# from the .proto sources so any edit here is lost anyway.
"smart_buildings/smart_control/proto/*_pb2.py" = ["ALL"]
# evaluate.py and scenario_generator.py also import modules purely for the
# @gin.configurable registration side effect, but those carry a per-line
# `# noqa: F401` instead of a blanket ignore here. A file-wide ignore also hides
# imports that really are dead, which is how an unused `from pathlib import
# Path` survived a cleanup pass.

[tool.setuptools.packages.find]
where = ["."]
include = ["smart_buildings*", "hvac_controller*"]

[tool.setuptools]
include-package-data = true

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
