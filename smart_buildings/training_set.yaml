# The training set: which weather strip each building is paired with.
#
# This file, not a cross product, defines the shipped scenarios. Every building
# sees one strip per station, and no strip is used twice, so the 6 buildings and
# 5 stations make 30 scenarios rather than 6 x 40 = 240.
#
# The set is 30 scenarios so that one policy over the whole set fits inside a
# single Kaggle session alongside the graded run. See README.md, "Scoring".
#
# `run_scenario_generator.py` with no arguments regenerates exactly these pairs.
# Passing --buildings or --weathers explicitly takes the cross product instead,
# which is what you want when generating your own scenarios. The generator
# inputs for stations and buildings outside this list are still shipped, so you
# can extend the set yourself; nothing here limits what you may generate.
scenarios:
- building: building_train_1
  weather: atlanta_2
- building: building_train_1
  weather: denver_7
- building: building_train_1
  weather: fairbanks_1
